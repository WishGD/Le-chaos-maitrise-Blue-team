<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomix - Video Chat</title>
    <link rel="stylesheet" href="style.css">
    <!-- Add this line to prevent favicon 404 error -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎥</text></svg>">
</head>
<body>
    <!-- Login/Register Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="authTitle">Login</h2>
            <form id="authForm">
                <div id="registerFields" style="display: none;">
                    <input type="email" id="email" placeholder="Email">
                </div>
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="authSubmit">Login</button>
            </form>
            <p>
                <span id="authToggleText">Don't have an account?</span>
                <a href="#" id="authToggle">Register</a>
            </p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display: none;">
        <header>
            <h1>Anomix</h1>
            <div class="user-info">
                <span id="currentUser"></span>
                <!-- <button id="logoutBtn">Logout</button> -->
                 <button><a href="http://localhost:3003/index.html" style="text-decoration: none; color: white; padding: 10px; background-color:#7F6DC0" >Logout</a></button>
            </div>
        </header>

        <main>
            <div class="video-container">
                <div class="video-wrapper">
                    <video id="localVideo" autoplay muted></video>
                    <label>You</label>
                </div>
                <div class="video-wrapper">
                    <video id="remoteVideo" autoplay></video>
                    <label>Stranger</label>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn">Start Chat</button>
                <button id="skipBtn" disabled>Skip</button>
                <button id="stopBtn" disabled>Stop</button>
            </div>

            <div class="status" id="status">Click "Start Chat" to begin</div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                    <button id="sendBtn" disabled>Send</button>
                </div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Fallback to CDN if local socket.io fails
        if (typeof io === 'undefined') {
            document.write('<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"><\/script>');
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
