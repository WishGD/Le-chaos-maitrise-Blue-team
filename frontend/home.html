
<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anomix — Connexion</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100svh; display:flex; flex-direction:column; }
    main { flex: 1 0 auto; }
    .brand { height: 40px; }
    .card .form-control { height: 48px; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg border-bottom" style="background-color:#7C76CE ;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <!-- <img src="assets/logo.png" alt="Anomix" class="brand"> -->
        <span class="fw-semibold" style="font-size: xx-large">🎥Anomix</span>
      </a>

      <div class="ms-auto d-flex gap-2">
        <a class="btn btn btn-secondary" href="home.html">Se connecter</a>
        <a class="btn btn-dark" href="registre.html">Créer un compte</a>
        <a class="btn btn-dark" href="support.html">Support</a>
        <button id="themeToggleBtn" class="btn btn-outline-secondary" type="button">☀️ Clair</button>
      </div>
    </div>
  </nav>

  <!-- Contenu -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <h1 class="h3 text-center mb-4">Se connecter</h1>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginUser" class="form-label">Nom d’utilisateur ou email</label>
                <input id="loginUser" name="username" class="form-control" required autocomplete="username" />
                <div class="invalid-feedback">Veuillez entrer votre nom d’utilisateur ou votre email.</div>
              </div>

              <div class="mb-3">
                <label for="loginPwd" class="form-label">Mot de passe</label>
                <input id="loginPwd" name="password" type="password" class="form-control" required autocomplete="current-password" />
                <div class="invalid-feedback">Veuillez entrer votre mot de passe.</div>
              </div>

              <button id="loginBtn" class="btn btn-primary w-100" type="submit">Connexion</button>
            </form>

            <div class="text-center mt-3">
              Pas encore de compte ?
              <a href="registre.html">Créer un compte</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="border-top py-3 text-center">
    © 2025 Anomix. Tous droits réservés.
  </footer>

  <!-- Bootstrap JS (optionnel) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Config API + Thème + Login -->
  <script>
    // ===== Détection de la base d’API =====
    // Si on est déjà servi depuis 3003 (backend), on reste en même origine.
    // Sinon (Live Server, etc.), on cible http://localhost:3003
    window.API_BASE = window.API_BASE ?? (location.port === '3003' ? '' : 'http://localhost:3003');

    // ===== Thème (clair/sombre) persistant =====
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-bs-theme', theme);
      localStorage.setItem('anomix-theme', theme);
      themeToggleBtn.textContent = theme === 'dark' ? '🌙 Sombre' : '☀️ Clair';
      themeToggleBtn.classList.toggle('btn-outline-light', theme === 'dark');
      themeToggleBtn.classList.toggle('btn-outline-secondary', theme !== 'dark');
    }

    const savedTheme = localStorage.getItem('anomix-theme') || 'light';
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const newTheme = (localStorage.getItem('anomix-theme') === 'dark') ? 'light' : 'dark';
      applyTheme(newTheme);
    });

    // ===== Utilitaire d’alerte simple =====
    function alertError(msg) { window.alert(msg); }

    // ===== Gestion du formulaire de connexion =====
    const loginForm = document.getElementById('loginForm');
    const loginBtn  = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!loginForm.checkValidity()) {
        loginForm.classList.add('was-validated');
        return;
      }

      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPwd').value;

      loginBtn.disabled = true;
      loginBtn.innerText = 'Connexion…';

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.success) {
          throw new Error(data?.error || 'Identifiants invalides');
        }

        // Stocke le token et le nom ; redirige vers la page principale (index.html)
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);

        // Redirection après succès
        location.href = 'index.html';
      } catch (err) {
        alertError(err.message || 'Erreur réseau. Réessayez.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Connexion';
      }
    });
  </script>
</body>
</html>
