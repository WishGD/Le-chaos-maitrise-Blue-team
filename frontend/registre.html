<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anomix — Créer un compte</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎥</text></svg>"
    />
    <style>
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1 0 auto;
      }
      .brand {
        height: 40px;
      }
      .card .form-control {
        height: 48px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg border-bottom"
      style="background-color: #7c76ce"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <!-- <img src="assets/logo.png" alt="Anomix" class="brand"> -->
          <span class="fw-semibold" style="font-size: xx-large">🎥Anomix</span>
        </a>

        <div class="ms-auto d-flex gap-2">
          <a class="btn btn-secondary" href="home.html">Se connecter</a>
          <a class="btn btn-dark" href="registre.html">Créer un compte</a>
          <button
            id="themeToggleBtn"
            class="btn btn-outline-secondary"
            type="button"
          >
            ☀️ Clair
          </button>
        </div>
      </div>
    </nav>

    <!-- Contenu -->
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <h1 class="h3 text-center mb-4">Créer un compte</h1>

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label for="regUsername" class="form-label"
                    >Nom d’utilisateur</label
                  >
                  <input
                    id="regUsername"
                    name="username"
                    class="form-control"
                    required
                    autocomplete="username"
                  />
                  <div class="invalid-feedback">
                    Veuillez entrer un nom d’utilisateur (3–20 caractères,
                    lettres/nombres/_).
                  </div>
                </div>

                <div class="mb-3">
                  <label for="regEmail" class="form-label">Email</label>
                  <input
                    id="regEmail"
                    name="email"
                    type="email"
                    class="form-control"
                    required
                    autocomplete="email"
                  />
                  <div class="invalid-feedback">
                    Veuillez entrer une adresse email valide.
                  </div>
                </div>

                <div class="mb-3">
                  <label for="regPassword" class="form-label"
                    >Mot de passe</label
                  >
                  <input
                    id="regPassword"
                    name="password"
                    type="password"
                    class="form-control"
                    required
                    autocomplete="new-password"
                  />
                  <div class="invalid-feedback">
                    Veuillez entrer un mot de passe d’au moins 6 caractères.
                  </div>
                </div>

                <button
                  id="registerBtn"
                  class="btn btn-primary w-100"
                  type="submit"
                >
                  Créer…
                </button>
              </form>

              <div class="text-center mt-3">
                Déjà inscrit ? <a href="home.html">Se connecter</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="border-top py-3 text-center">
      © 2025 Anomix. Tous droits réservés.
    </footer>

    <!-- Bootstrap JS (optionnel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // ===== Base API (robuste) =====
      const API_BASE =
        typeof window.API_BASE !== "undefined"
          ? window.API_BASE
          : location.port === "3003"
          ? ""
          : "http://localhost:3003";

      // ===== Thème (clair/sombre) persistant =====
      const themeToggleBtn = document.getElementById("themeToggleBtn");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-bs-theme", theme);
        localStorage.setItem("anomix-theme", theme);
        themeToggleBtn.textContent =
          theme === "dark" ? "🌙 Sombre" : "☀️ Clair";
        themeToggleBtn.classList.toggle("btn-outline-light", theme === "dark");
        themeToggleBtn.classList.toggle(
          "btn-outline-secondary",
          theme !== "dark"
        );
      }

      const savedTheme = localStorage.getItem("anomix-theme") || "light";
      applyTheme(savedTheme);

      themeToggleBtn.addEventListener("click", () => {
        const newTheme =
          localStorage.getItem("anomix-theme") === "dark" ? "light" : "dark";
        applyTheme(newTheme);
      });

      // ===== Utilitaire d’alerte simple =====
      function alertError(msg) {
        window.alert(msg);
      }

      // ===== Validation simple côté client =====
      function validUsername(u) {
        return /^[a-zA-Z0-9_]{3,20}$/.test(u);
      }
      function validPassword(p) {
        return typeof p === "string" && p.length >= 6;
      }

      // ===== Gestion du formulaire d'inscription =====
      const registerForm = document.getElementById("registerForm");
      const registerBtn = document.getElementById("registerBtn");

      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Bootstrap validation UI
        if (!registerForm.checkValidity()) {
          registerForm.classList.add("was-validated");
          return;
        }

        const username = document.getElementById("regUsername").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const password = document.getElementById("regPassword").value;

        // garde-fous supplémentaires
        if (!validUsername(username)) {
          alertError(
            "Nom d’utilisateur invalide. Utilisez 3–20 caractères (lettres, chiffres, souligné)."
          );
          return;
        }
        if (!validPassword(password)) {
          alertError("Mot de passe trop court (min. 6 caractères).");
          return;
        }

        registerBtn.disabled = true;
        registerBtn.innerText = "Création…";

        try {
          const res = await fetch(`${API_BASE}/api/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.success) {
            throw new Error(data?.error || "Création de compte impossible");
          }

          // Si le backend renvoie un token, on peut connecter l’utilisateur directement
          if (data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("username", data.username || username);
            location.href = "index.html"; // accès à l'app
          } else {
            // Sinon, redirection vers la page de connexion
            location.href = "home.html";
          }
        } catch (err) {
          alertError(err.message || "Erreur réseau. Réessayez.");
        } finally {
          registerBtn.disabled = false;
          registerBtn.innerText = "Créer…";
        }
      });
    </script>
  </body>
</html>
